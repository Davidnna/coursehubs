name: CourseHubs database recovery test

on:
    workflow_dispatch:
        inputs:
            confirm_recovery_database:
                description: Confirm that coursehubs_recovery is a new, empty database in the separate backup Neon project
                required: true
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: coursehubs-database-recovery-test
    cancel-in-progress: false

jobs:
    restore-test:
        name: Restore the latest database backup into the recovery database
        if: ${{ inputs.confirm_recovery_database }}
        runs-on: ubuntu-latest
        timeout-minutes: 120
        env:
            RESTORE_DATABASE_URL: ${{ secrets.COURSEHUBS_RECOVERY_DATABASE_URL }}
            PRODUCTION_DATABASE_URL: ${{ secrets.COURSEHUBS_BACKUP_DATABASE_URL }}
            RESTORE_CONFIRM: ${{ inputs.confirm_recovery_database && 'RESTORE_TO_EMPTY_DATABASE' || '' }}
            RESTIC_PASSWORD: ${{ secrets.COURSEHUBS_RESTIC_PASSWORD }}
            RESTIC_HOST: coursehubs-production
            BACKUP_S3_ENDPOINT: ${{ secrets.COURSEHUBS_BACKUP_S3_ENDPOINT }}
            BACKUP_S3_BUCKET: ${{ secrets.COURSEHUBS_BACKUP_S3_BUCKET }}
            AWS_ACCESS_KEY_ID: ${{ secrets.COURSEHUBS_BACKUP_S3_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.COURSEHUBS_BACKUP_S3_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION: ${{ secrets.COURSEHUBS_BACKUP_S3_REGION }}

        steps:
            - name: Check out the default branch
              uses: actions/checkout@v4

            - name: Validate recovery destination and credentials
              shell: bash
              run: |
                  set -euo pipefail
                  required=(
                      RESTORE_DATABASE_URL
                      PRODUCTION_DATABASE_URL
                      RESTORE_CONFIRM
                      RESTIC_PASSWORD
                      BACKUP_S3_ENDPOINT
                      BACKUP_S3_BUCKET
                      AWS_ACCESS_KEY_ID
                      AWS_SECRET_ACCESS_KEY
                      AWS_DEFAULT_REGION
                  )
                  for name in "${required[@]}"; do
                      if [[ -z "${!name:-}" ]]; then
                          printf 'Missing required GitHub Actions secret/configuration: %s\n' "$name" >&2
                          exit 1
                      fi
                  done
                  if [[ "$RESTORE_CONFIRM" != 'RESTORE_TO_EMPTY_DATABASE' ]]; then
                      printf '%s\n' 'Recovery was not explicitly confirmed.' >&2
                      exit 1
                  fi
                  if [[ "$RESTORE_DATABASE_URL" == *'-pooler.'* || "$PRODUCTION_DATABASE_URL" == *'-pooler.'* ]]; then
                      printf '%s\n' 'Use direct, unpooled Neon connection strings for database recovery.' >&2
                      exit 1
                  fi
                  python3 - <<'PY'
                  import os
                  from urllib.parse import unquote, urlsplit

                  target = urlsplit(os.environ['RESTORE_DATABASE_URL'])
                  production = urlsplit(os.environ['PRODUCTION_DATABASE_URL'])
                  target_database = unquote(target.path.lstrip('/'))
                  if not target.hostname or not production.hostname:
                      raise SystemExit('A database connection string is invalid.')
                  if target_database != 'coursehubs_recovery':
                      raise SystemExit('The recovery destination must be the coursehubs_recovery database.')
                  if target.hostname.lower() == production.hostname.lower():
                      raise SystemExit('The recovery database must be in a separate Neon project from production.')
                  print('Recovery destination checks passed; connection details are not displayed.')
                  PY

            - name: Install Restic
              shell: bash
              run: |
                  set -euo pipefail
                  sudo apt-get update
                  sudo apt-get install -y restic
                  printf 'RESTIC_REPOSITORY=s3:%s/%s/coursehubs-restic\n' \
                      "${BACKUP_S3_ENDPOINT%/}" "$BACKUP_S3_BUCKET" >> "$GITHUB_ENV"

            - name: Confirm that a database backup is available
              shell: bash
              run: |
                  set -euo pipefail
                  restic -o "s3.region=$AWS_DEFAULT_REGION" -o 's3.bucket-lookup=path' \
                      snapshots --json --tag database --host "$RESTIC_HOST" > "$RUNNER_TEMP/database-snapshots.json"
                  python3 - "$RUNNER_TEMP/database-snapshots.json" <<'PY'
                  import json
                  import sys
                  with open(sys.argv[1], encoding='utf-8') as source:
                      snapshots = json.load(source)
                  if not snapshots:
                      raise SystemExit('No database backup snapshot is available.')
                  latest = max(snapshots, key=lambda item: item['time'])
                  print(f"Found {len(snapshots)} database snapshot(s). Latest: {latest['time']} UTC.")
                  PY

            - name: Restore latest backup into the empty recovery database
              shell: bash
              run: bash scripts/backup/restore_database.sh

            - name: Verify restored database schema and core records
              shell: bash
              run: |
                  set -euo pipefail
                  docker run --rm -e RESTORE_DATABASE_URL postgres:18-alpine sh -euc '
                      missing="$(psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
                          SELECT string_agg(expected.name, '\'', '\'' ORDER BY expected.name)
                          FROM unnest(ARRAY[
                              '\''coursehubs_schema_migrations'\'',
                              '\''users'\'',
                              '\''faculties'\'',
                              '\''departments'\'',
                              '\''programmes'\'',
                              '\''academic_sessions'\'',
                              '\''courses'\'',
                              '\''course_offerings'\'',
                              '\''uploads'\'',
                              '\''administrator_scopes'\'',
                              '\''auth_rate_limits'\''
                          ]) AS expected(name)
                          WHERE to_regclass('\''public.'\'' || expected.name) IS NULL
                      ")"
                      if [ -n "$missing" ]; then
                          printf "Missing required restored tables: %s\\n" "$missing" >&2
                          exit 1
                      fi

                      migrations="$(psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc \
                          "SELECT COUNT(*) FROM public.coursehubs_schema_migrations")"
                      if [ "$migrations" -lt 13 ]; then
                          printf "Expected at least 13 applied migrations; found %s.\\n" "$migrations" >&2
                          exit 1
                      fi

                      users="$(psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM public.users")"
                      courses="$(psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM public.courses WHERE deleted_at IS NULL")"
                      offerings="$(psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM public.course_offerings WHERE deleted_at IS NULL")"
                      uploads="$(psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM public.uploads WHERE deleted_at IS NULL")"

                      if [ "$users" -lt 1 ] || [ "$courses" -lt 1 ] || [ "$offerings" -lt 1 ]; then
                          printf "%s\\n" "Core account, course or offering records are missing after recovery." >&2
                          exit 1
                      fi

                      orphan_uploads="$(psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
                          SELECT COUNT(*)
                          FROM public.uploads u
                          LEFT JOIN public.courses c ON c.id = u.course_id
                          WHERE c.id IS NULL
                      ")"
                      if [ "$orphan_uploads" -ne 0 ]; then
                          printf "Recovered database contains %s uploads without a course.\\n" "$orphan_uploads" >&2
                          exit 1
                      fi

                      printf "Applied migrations: %s\\nUsers: %s\\nActive courses: %s\\nActive course offerings: %s\\nActive uploads: %s\\n" \
                          "$migrations" "$users" "$courses" "$offerings" "$uploads"
                      printf "%s\\n" "Required tables and upload relationships verified."
                  '

            - name: Publish recovery test summary
              if: success()
              shell: bash
              run: |
                  {
                      echo '## CourseHubs database recovery test passed'
                      echo
                      echo '- The latest encrypted database backup was restored into the separate `coursehubs_recovery` database.'
                      echo '- The destination was verified to be empty before restoration.'
                      echo '- The restored database contains application tables.'
                      echo '- The production database was not modified.'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Record recovery test failure
              if: failure()
              shell: bash
              run: |
                  {
                      echo '## CourseHubs database recovery test failed'
                      echo
                      echo '- Review the failed step before retrying.'
                      echo '- The workflow is configured to restore only into `coursehubs_recovery` in the separate backup Neon project.'
                      echo '- The production database is not a restore target.'
                  } >> "$GITHUB_STEP_SUMMARY"
